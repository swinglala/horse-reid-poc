[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horse_reid"
version = "0.1.0"
description = "Horse re-identification POC: detection, tracking, head localisation and frame selection (Phase 1)."
readme = "README.md"
requires-python = ">=3.10"
# Runtime deps are pinned in requirements.txt (torch must be 2.2.2 on Intel macOS).
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
